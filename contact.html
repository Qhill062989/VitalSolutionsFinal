<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Vital Solutions | Get a Consultation</title>
    <meta name="description" content="Contact Vital Solutions today for a professional healthcare management consultation. Fill out our form to get started.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <a href="blog.html">Blog</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="container">
        <h1>Contact Us</h1>
        <p>Ready to streamline your medical workflow? Fill out the form below and one of our consultants will reach out to you shortly.</p>
        
        <form action="#" method="post">
            <label for="fname">Full Name:</label>
            <input type="text" id="fname" name="fullname" placeholder="Enter your name" required>

            <label for="email">Work Email:</label>
            <input type="email" id="email" name="email" placeholder="email@example.com" required>

            <label for="subject">How can we help?</label>
            <select id="subject" name="subject">
                <option value="consult">General Consultation</option>
                <option value="intake">Intake Solutions</option>
                <option value="support">Technical Support</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="6" placeholder="Tell us about your facility's needs..." required></textarea>

            <button type="submit">Send Inquiry</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Vital Solutions. Form validated and responsive.</p>
    </footer>
</body>
</html>
